<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Agent transcripts</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- The owner's page (2026-11-22, the operator: "a separate page for me to see the tokens generated by the local AI agents", to look into how the
     agents work and what they see). For one session, every call of the local model in order: which agent (the researcher, the judge, the
     supervisor), the two messages it was given, what it wrote before its answer, its answer, its tokens, why it stopped and how long it took.
     Its data comes from GET /api/agents?session=<id> (harness/control.py). Since 2026-11-22 (the operator: "everyone who sees the page") it answers
     everyone who can open the session's page, view-only visitors from the network included; the files themselves are still not given out. A session run before calls.jsonl existed (before 2026-11-22) shows
     what was kept of it: what the researcher wrote before each answer, its accepted answers, the supervisor's records, the counts of the ledger.
     The page never moves by itself: a call that arrives while a session runs is added at the end, and a note at the top says so. -->
<style>
.ag { color-scheme: light; --f-note: 12px; --f-sec: 13px; --f-text: 14px; --f-card: 16px; --f-page: 20px;
  --surface-0: #f4f4f2; --surface-1: #fcfcfb; --border: #dddcd6; --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #686762;
  --by-model: #6250d6; --by-supervisor: #1c9aa6; --by-harness: #c2407a; --warning: #8f5200; --critical: #d03b3b; --live: #087688; }
@media (prefers-color-scheme: dark) { .ag { color-scheme: dark; --surface-0: #121211; --surface-1: #1a1a19; --border: #383835; --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
  --by-model: #9085e9; --by-supervisor: #3fb6c2; --by-harness: #d55181; --warning: #e0a030; --critical: #e66767; --live: #5fd0e0; } }
* { box-sizing: border-box; } body { margin: 0; }
.ag { background: var(--surface-0); color: var(--text-primary); min-height: 100vh; font: var(--f-text)/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; font-variant-numeric: tabular-nums; padding: 14px 20px 60px; }
.ag h1 { font-size: var(--f-page); margin: 0 0 4px; } .ag h2 { font-size: var(--f-card); margin: 18px 0 8px; } .ag .sm { font-size: var(--f-sec); color: var(--text-secondary); } .ag .mut { color: var(--text-muted); }
.ag .bar { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 8px 14px; margin: 8px 0 10px; position: sticky; top: 0; z-index: 3; box-shadow: 0 2px 8px rgb(0 0 0 / .07); }
.ag .bar label { display: inline-flex; gap: 6px; align-items: center; } .ag select, .ag button { font: inherit; color: var(--text-primary); background: var(--surface-1); border: 1px solid var(--border); border-radius: 6px; padding: 2px 8px; cursor: pointer; }
.ag button.on { background: var(--text-primary); color: var(--surface-1); border-color: var(--text-primary); } .ag .grp { display: inline-flex; gap: 4px; align-items: center; }
.ag .facts { display: flex; flex-wrap: wrap; gap: 4px 22px; } .ag .facts span b { font-weight: 650; } .ag .facts span > i { font-style: normal; color: var(--text-secondary); font-size: var(--f-note); display: block; }
.ag .note { border: 1px solid var(--border); border-left: 4px solid var(--warning); border-radius: 8px; background: var(--surface-1); padding: 8px 12px; margin: 8px 0; max-width: 1100px; }
.ag .note.live { border-left-color: var(--live); } .ag .err { border-left-color: var(--critical); }
.ag .turn { margin: 16px 0 6px; padding-bottom: 3px; border-bottom: 1px solid var(--border); font-size: var(--f-card); font-weight: 700; }
.ag .call { background: var(--surface-1); border: 1px solid var(--border); border-left: 4px solid var(--by-model); border-radius: 10px; padding: 8px 14px 10px; margin: 8px 0; }
.ag .call[data-agent=judge], .ag .call[data-agent=supervisor] { border-left-color: var(--by-supervisor); }
.ag .call.new { box-shadow: 0 0 0 2px color-mix(in srgb, var(--live) 45%, transparent); }
.ag .ch { display: flex; flex-wrap: wrap; gap: 2px 16px; align-items: baseline; } .ag .who { font-weight: 700; font-size: var(--f-card); } .ag .who[data-agent=researcher] { color: var(--by-model); } .ag .who[data-agent=judge], .ag .who[data-agent=supervisor] { color: var(--by-supervisor); }
.ag .stop-length { color: var(--warning); font-weight: 700; }
.ag details { margin-top: 6px; border-top: 1px solid var(--border); padding-top: 5px; } .ag details > summary { cursor: pointer; font-weight: 650; } .ag details > summary .sm { font-weight: 400; margin-left: 6px; }
.ag pre { white-space: pre-wrap; overflow-wrap: anywhere; font: var(--f-sec)/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: var(--surface-0); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; margin: 6px 0 2px; max-height: 520px; overflow: auto; }
.ag .msg-h { font-size: var(--f-note); color: var(--text-secondary); margin-top: 6px; font-weight: 650; }
.ag .same { font-size: var(--f-sec); color: var(--text-muted); margin: 4px 0; }
</style></head><body>
<div class="ag" id="ag"><p class="sm">Loading…</p></div>
<script>
const AG = {
  e: s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]),
  n: v => (v == null || v === '' ? '–' : Number(v).toLocaleString('en-US')),
  AGENT: { researcher: ['Researcher', 'the AI that proposes, runs experiments and reports'], judge: ['Judge', 'the AI asked apart whether a hypothesis comes from its guess'], supervisor: ['Supervisor', 'the AI asked apart to check each step of the researcher'] },
  sid: new URLSearchParams(location.search).get('session'), data: null, shown: 0, only: 'all', timer: null,
  async json(u) { const r = await fetch(u, { cache: 'no-store' }); const d = await r.json().catch(() => ({ error: `${r.status} ${r.statusText}` })); if (!r.ok) throw new Error(d.error || r.statusText); return d; },
  async start() {
    let list = []; try { list = await AG.json('../api/sessions'); } catch (x) { /* the list is a convenience */ }
    AG.list = list; if (!AG.sid && list.length) AG.sid = list[list.length - 1].id;
    await AG.load(); document.addEventListener('click', AG.click); document.addEventListener('change', AG.change);
  },
  async load() {
    try { AG.data = await AG.json('../api/agents?session=' + encodeURIComponent(AG.sid || '')); AG.err = null; } catch (x) { AG.data = null; AG.err = x.message; }
    AG.draw(); clearTimeout(AG.timer); if (AG.data && AG.data.running) AG.timer = setTimeout(AG.poll, 4000);
    // opened from a turn of the session's page (#turn-N): the page opens at that turn, once
    if (location.hash && !AG.jumped) { AG.jumped = true; const el = document.getElementById(location.hash.slice(1)); if (el) el.scrollIntoView({ block: 'start' }); }
  },
  // a running session: the calls that came in since are added at the end; nothing that is shown is drawn again, and the page does not move
  async poll() {
    let d; try { d = await AG.json('../api/agents?session=' + encodeURIComponent(AG.sid)); } catch (x) { AG.timer = setTimeout(AG.poll, 8000); return; }
    const fresh = d.calls.slice(AG.data.calls.length); AG.data = d;
    if (fresh.length) { const box = document.getElementById('ag-calls'); if (box) { const prev = AG.data.calls.length - fresh.length; box.insertAdjacentHTML('beforeend', fresh.map((c, i) => AG.callHtml(c, prev + i, true)).join('')); }
      const n = document.getElementById('ag-live'); if (n) n.innerHTML = AG.liveSay(fresh.length); }
    document.getElementById('ag-facts').innerHTML = AG.factsHtml(); if (d.running) AG.timer = setTimeout(AG.poll, 4000); else { const n = document.getElementById('ag-live'); if (n) n.innerHTML = 'The session has ended: every call it made is below.'; }
  },
  liveSay: k => `${AG.data.running ? '<b>This session is running.</b> ' : ''}${k ? `${k} new ${k === 1 ? 'call was' : 'calls were'} added at the end (outlined).` : 'A new call is added at the end as soon as it returns; the page does not move.'}`,
  // the totals: calls by agent, tokens given and written (prompt and completion tokens as the model server counted them)
  factsHtml() {
    const D = AG.data, C = D.calls || [], by = {}; C.forEach(c => { by[c.agent] = (by[c.agent] || 0) + 1; });
    const sum = k => C.reduce((a, c) => a + ((c.usage || {})[k] || 0), 0), cut = C.filter(c => c.finish_reason === 'length').length, f = D.flags || {};
    const items = C.length ? [['calls', `${C.length}`, Object.entries(by).map(([a, n]) => `${n} ${(AG.AGENT[a] || [a])[0].toLowerCase()}`).join(', ')], ['tokens given', AG.n(sum('prompt_tokens')), 'all calls together'], ['tokens written', AG.n(sum('completion_tokens')), 'before the answers and the answers'], ['cut by the length limit', `${cut}`, cut ? 'their answer could not be used' : 'none']]
      : [['what the researcher wrote before its answers', `${(D.drafts || []).length}`, AG.n((D.counts || []).reduce((a, c) => a + (c.tokens || 0), 0)) + ' tokens'], ['accepted answers', `${(D.answers || []).length}`, ''], ['supervisor records', `${(D.supervisor || []).length}`, '']];
    return [['model', D.model || '–', ''], ['limits', `${AG.n(f.max_tokens)} tokens a reply`, f.draft === 'on' ? `of which at most ${AG.n(f.draft_tokens)} before the answer` : 'nothing written before the answer'], ['temperature', f.temperature ?? '–', ''], ...items]
      .map(([k, v, s]) => `<span><i>${AG.e(k)}</i><b>${AG.e(v)}</b>${s ? ` <span class="sm">${AG.e(s)}</span>` : ''}</span>`).join('');
  },
  pretty(t) { try { return JSON.stringify(typeof t === 'string' ? JSON.parse(t) : t, null, 1); } catch (x) { return String(t ?? ''); } },
  // one call: who, its turn, its tokens; folded under it what it was given (the system message said once and then "the same as call n"), what it wrote before its answer, its answer
  callHtml(c, i, isNew) {
    const e = AG.e, C = AG.data.calls, u = c.usage || {}, [name, says] = AG.AGENT[c.agent] || [c.agent, ''], first = C.findIndex(x => x.system === c.system), rd = (u.completion_tokens_details || {}).reasoning_tokens;
    const turnHead = i === 0 || C[i - 1].turn !== c.turn ? `<div class="turn" id="turn-${c.turn}">Turn ${e(c.turn)}</div>` : '';
    const att = C.filter((x, j) => j < i && x.turn === c.turn && x.agent === c.agent).length;
    return `${turnHead}<div class="call${isNew ? ' new' : ''}" data-agent="${e(c.agent)}" id="call-${e(c.n)}"${AG.only !== 'all' && AG.only !== c.agent ? ' hidden' : ''}>
      <div class="ch"><span class="who" data-agent="${e(c.agent)}" title="${e(says)}">${e(name)}</span><span class="sm">call ${e(c.n)}${att ? ` · its ${att + 1}${['', '', 'nd', 'rd'][att + 1] || 'th'} call this turn` : ''} · ${e(c.at || '')}</span>
        <span>given <b>${AG.n(u.prompt_tokens)}</b> tokens → wrote <b>${AG.n(u.completion_tokens)}</b>${rd != null ? ` <span class="sm">(${AG.n(rd)} before the answer)</span>` : ''}</span>
        <span class="sm">stopped: <span class="${c.finish_reason === 'length' ? 'stop-length' : ''}">${e(c.finish_reason === 'length' ? 'the length limit' : c.finish_reason || '–')}</span> · ${e(c.seconds ?? '–')} s · at most ${AG.n(c.max_tokens)} tokens · temperature ${e(c.temperature)}</span></div>
      <details data-f="given"${AG.open.given ? ' open' : ''}><summary>What it was given <span class="sm">the system message and the user message</span></summary>
        <div class="msg-h">System message · ${AG.n((c.system || '').length)} characters</div>${first < i ? `<p class="same">The same as in call ${e(C[first].n)}. <button data-act="sys" data-i="${i}">show it here</button></p>` : `<pre>${e(c.system)}</pre>`}
        <div class="msg-h">User message · ${AG.n((c.user || '').length)} characters</div><pre>${e(c.user)}</pre></details>
      <details data-f="before"${AG.open.before ? ' open' : ''}><summary>What it wrote before its answer <span class="sm">${c.draft ? AG.n((c.reasoning || '').length) + ' characters' : 'asked for none'}</span></summary>${c.reasoning ? `<pre>${e(c.reasoning)}</pre>` : '<p class="sm">Nothing.</p>'}</details>
      <details data-f="answer"${AG.open.answer ? ' open' : ''}><summary>Its answer <span class="sm">${AG.n((c.answer || '').length)} characters</span></summary><pre>${e(AG.pretty(c.answer))}</pre></details></div>`;
  },
  // a session run before calls.jsonl: by turn, what the researcher wrote before each answer (with the ledger's counts), its accepted answer, and the supervisor's records
  oldHtml() {
    const e = AG.e, D = AG.data, turns = [...new Set([...(D.drafts || []), ...(D.answers || []), ...(D.supervisor || [])].map(r => r.turn))].sort((a, b) => a - b), cnt = Object.fromEntries((D.counts || []).map(c => [c.id, c]));
    return turns.map(t => `<div class="turn" id="turn-${t}">Turn ${e(t)}</div>`
      + (D.drafts || []).filter(r => r.turn === t).map(r => { const k = cnt[r.id] || {}; return `<div class="call" data-agent="researcher"${AG.only !== 'all' && AG.only !== 'researcher' ? ' hidden' : ''}><div class="ch"><span class="who" data-agent="researcher">Researcher</span><span class="sm">${e(r.id)} · wrote ${AG.n(k.tokens)} tokens before its answer · stopped: <span class="${k.finish_reason === 'length' ? 'stop-length' : ''}">${e(k.finish_reason === 'length' ? 'the length limit' : k.finish_reason || '–')}</span></span></div>
          <details data-f="before"${AG.open.before ? ' open' : ''}><summary>What it wrote before its answer <span class="sm">${AG.n((r.text || '').length)} characters</span></summary><pre>${e(r.text)}</pre></details></div>`; }).join('')
      + (D.answers || []).filter(r => r.turn === t).map(r => `<div class="call" data-agent="researcher"${AG.only !== 'all' && AG.only !== 'researcher' ? ' hidden' : ''}><div class="ch"><span class="who" data-agent="researcher">Researcher</span><span class="sm">the answer the harness accepted this turn</span></div><details data-f="answer"${AG.open.answer ? ' open' : ''}><summary>Its answer</summary><pre>${e(AG.pretty(r.answer))}</pre></details></div>`).join('')
      + (D.supervisor || []).filter(r => r.turn === t).map(r => `<div class="call" data-agent="supervisor"${AG.only !== 'all' && AG.only !== 'supervisor' ? ' hidden' : ''}><div class="ch"><span class="who" data-agent="supervisor">Supervisor</span><span class="sm">${e(r.id)} · ${e(r.gate)}</span></div>
          <details data-f="given"${AG.open.given ? ' open' : ''}><summary>What it was given <span class="sm">${AG.n((r.shown || '').length)} characters</span></summary><pre>${e(r.shown)}</pre></details><details data-f="answer"${AG.open.answer ? ' open' : ''}><summary>Its answer</summary><pre>${e(AG.pretty(r.answer))}</pre></details></div>`).join('')).join('');
  },
  open: { given: false, before: true, answer: true },
  draw() {
    const e = AG.e, D = AG.data, root = document.getElementById('ag'), opt = (AG.list || []).slice().reverse().map(s => `<option value="${e(s.id)}"${s.id === AG.sid ? ' selected' : ''}>${e(s.id)} · ${e(s.brief || '')} · ${e(String(s.started || '').replace('T', ' ').slice(0, 16))}${s.running ? ' · running' : ''}</option>`).join('');
    const agents = D ? [...new Set([...(D.calls || []).map(c => c.agent), ...((D.calls || []).length ? [] : [(D.drafts || []).length || (D.answers || []).length ? 'researcher' : null, (D.supervisor || []).length ? 'supervisor' : null])].filter(Boolean))] : [];
    const head = `<h1>Agent transcripts</h1><p class="sm">Every call of the local model in this session, in order: what each agent was given and what it wrote. Anyone who can open the session's page can open this one.</p>
      <div class="bar"><label>Session <select id="ag-sid">${opt || `<option>${e(AG.sid || '')}</option>`}</select></label>
        <span class="grp">Show <button data-act="only" data-v="all" class="${AG.only === 'all' ? 'on' : ''}">every agent</button>${agents.map(a => `<button data-act="only" data-v="${e(a)}" class="${AG.only === a ? 'on' : ''}">${e((AG.AGENT[a] || [a])[0])}</button>`).join('')}</span>
        <span class="grp">Open in every call ${[['given', 'what it was given'], ['before', 'what it wrote first'], ['answer', 'its answer']].map(([k, s]) => `<button data-act="fold" data-v="${k}" class="${AG.open[k] ? 'on' : ''}" title="open or fold this part in every call">${s}</button>`).join('')}</span>
        <a href="index.html${AG.sid ? '?session=' + encodeURIComponent(AG.sid) : ''}">the session's page</a></div>`;
    if (!D) { root.innerHTML = head + `<div class="note err"><b>Cannot show this session.</b> ${e(AG.err || '')}</div>`; return; }
    const old = !(D.calls || []).length;
    root.innerHTML = head + `<div class="facts" id="ag-facts">${AG.factsHtml()}</div>`
      + (D.running ? `<div class="note live" id="ag-live">${AG.liveSay(0)}</div>` : '')
      + (old ? `<div class="note">This session was run before every call was recorded (2026-11-22). Kept of it: what the researcher wrote before each answer, the answers the harness accepted${(D.supervisor || []).length ? ', and what the supervisor was given and answered' : ''}. What the researcher was given in each turn, and the judge's calls, were not kept.</div>` : '')
      + `<div id="ag-calls">${old ? AG.oldHtml() : D.calls.map((c, i) => AG.callHtml(c, i, false)).join('')}</div>`;
  },
  click(ev) {
    const b = ev.target.closest('[data-act]'); if (!b) return; const v = b.dataset.v;
    if (b.dataset.act === 'only') { AG.only = v; document.querySelectorAll('#ag-calls .call').forEach(c => { c.hidden = v !== 'all' && c.dataset.agent !== v; }); document.querySelectorAll('[data-act=only]').forEach(x => x.classList.toggle('on', x.dataset.v === v)); }
    if (b.dataset.act === 'fold') { AG.open[v] = !AG.open[v]; b.classList.toggle('on', AG.open[v]); document.querySelectorAll(`#ag-calls details[data-f=${v}]`).forEach(d => { d.open = AG.open[v]; }); }
    if (b.dataset.act === 'sys') { const c = AG.data.calls[+b.dataset.i]; b.parentElement.outerHTML = `<pre>${AG.e(c.system)}</pre>`; }
  },
  change(ev) { if (ev.target.id === 'ag-sid') { AG.sid = ev.target.value; AG.shown = 0; history.replaceState(null, '', '?session=' + encodeURIComponent(AG.sid)); AG.load(); } },
};
AG.start();
</script>
</body></html>
