<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Two hosts, one link</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- The harness's own viewer: a static page served by harness/control.py. It asks ../api/sessions for the list of
     sessions, then reads the chosen session's own files (../sessions/<id>/ledger.jsonl, runs/index.json,
     runs/<run>/series.csv, session.json = the brief it was given), ../checks/operator.jsonl (the scheduling policy of each run)
     every 5 s, and writes nothing. "Operator checks" shows ../checks/build1/ and ../checks/control.jsonl instead.
     Content and layout live in adrs_view.js (TH_DATA builds the content, TASK_VIEW.page draws it); the same file
     draws this task inside the ADRS main viewer. One page: every run, then the chosen run (why it was made, its
     numbers over time, what it showed). The charts are Chart.js, loaded from the CDN by adrs_view.js.
     The earlier six-page viewer (system objects, packet events, run control) is kept as index_full.html with
     adrs_view_full.js; the first page as index_old.html. -->
<style>
.viz-root {
  color-scheme: light;
  --surface-0: #f4f4f2; --surface-1: #fcfcfb; --border: #dddcd6;
  --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #7a7974;
  --grid: #e6e5e0; --series-1: #2a78d6; --series-2: #eb6834; --critical: #d03b3b; --good: #0ca30c;
}
@media (prefers-color-scheme: dark) {
  .viz-root {
    color-scheme: dark;
    --surface-0: #121211; --surface-1: #1a1a19; --border: #383835;
    --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
    --grid: #2b2b29; --series-1: #3987e5; --series-2: #d95926; --critical: #d03b3b; --good: #0ca30c;
  }
}
* { box-sizing: border-box; }
body { margin: 0; }
.viz-root { background: var(--surface-0); color: var(--text-primary); min-height: 100vh;
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 20px 24px 40px; }
.bar { max-width: 1280px; margin: 0 auto 14px; display: flex; gap: 10px 18px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--text-secondary); }
.bar .lbl { font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); }
.pick { font: inherit; font-size: 13.5px; padding: 5px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-1); color: var(--text-primary); cursor: pointer; }
.bar .end { margin-left: auto; } .bar a { color: var(--text-secondary); }
.empty { max-width: 1280px; margin: 40px auto; color: var(--text-secondary); font-size: 15px; }
</style></head><body>
<div class="viz-root">
  <div class="bar">
    <span class="lbl">Showing</span>
    <select class="pick" id="runs" aria-label="Session to show"></select>
    <span class="end" id="note"></span>
  </div>
  <div id="page"><div class="empty">Loading the harness's files…</div></div>
</div>
<script>
const $ = id => document.getElementById(id);
const css = n => getComputedStyle(document.querySelector('.viz-root')).getPropertyValue(n).trim();  // used by adrs_view.js
const CHECKS = 'operator_checks', Q = new URLSearchParams(location.search);
let run = Q.get('session') || Q.get('run') || '', series = {}, listed = '';

async function get(url) {  // text of a file next to the harness, or null
  try {
    const r = await fetch(url + '?t=' + Date.now(), { cache: 'no-store' });
    return { text: r.ok ? await r.text() : null };
  } catch (e) { return { text: null }; }
}
const json = t => { try { return JSON.parse(t); } catch (e) { return null; } };
const lines = t => (t || '').split('\n').filter(Boolean).map(json).filter(Boolean);
const when = ts => String(ts || '').replace('T', ' ').slice(0, 16);

// What a session was given, in the shape adrs_view.js reads (task, params = the knobs, fixed = the system settings).
// A session made before briefs existed, and the operator checks, have no session.json: the open brief stands in.
let standIn = null;
async function given(meta) {
  let g = meta && meta.given;
  if (!g) {
    if (!standIn) { const [b, m] = await Promise.all([get('../briefs/two-hosts-open.json'), get('../harness/manifest.json')]); standIn = json(b.text) && json(m.text) ? { ...json(b.text), ...json(m.text), id: null } : null; }
    g = standIn;
  }
  return g && { ...g, params: g.knobs, fixed: g.system, brief: g.id, model: (meta && meta.model) || null };
}

async function load() {
  const [st, sl] = await Promise.all([get('../api/status'), get('../api/sessions')]);
  const ctl = json(st.text), ses = json(sl.text);
  if (!Array.isArray(ses)) { $('note').textContent = 'Cannot read the harness (this page is served by harness/control.py, which also lists the sessions; is it running in ~/project?)'; return; }
  // which one to show: the one asked for; otherwise the session running now, otherwise the newest
  if (run !== CHECKS && !ses.some(s => s.id === run)) run = (ses.find(s => s.running) || ses[ses.length - 1] || { id: CHECKS }).id;
  const sig = JSON.stringify([ses.map(s => [s.id, s.brief, s.started, s.experiments, s.running, s.policy]), run]);
  if (sig !== listed) {  // the list is redrawn only when it changed, so an open list is not closed by the 5 s refresh
    listed = sig;
    $('runs').innerHTML = '<optgroup label="AI sessions (newest first)">' + [...ses].reverse().map(s =>
        `<option value="${s.id}"${s.id === run ? ' selected' : ''}>${s.id} · ${s.brief || 'before briefs'} · ${s.started ? when(s.started) : 'no record yet'} · ${s.experiments} experiment${s.experiments === 1 ? '' : 's'}${s.policy ? ' · policy ' + s.policy : ''}${s.running ? ' · running now' : ''}</option>`).join('') +
      `</optgroup><optgroup label="No AI"><option value="${CHECKS}"${run === CHECKS ? ' selected' : ''}>Operator checks of the simulator</option></optgroup>`;
    $('runs').onchange = () => { run = $('runs').value; history.replaceState(null, '', run === CHECKS ? '?run=' + CHECKS : '?session=' + run); load(); };
  }
  const checks = run === CHECKS, base = checks ? '../checks/build1/' : `../sessions/${run}/runs/`, shown = run;
  const [led, idx, op, meta, own] = await Promise.all([checks ? { text: '' } : get(`../sessions/${run}/ledger.jsonl`), get(base + 'index.json'), get('../checks/operator.jsonl'),
    checks ? { text: null } : get(`../sessions/${run}/session.json`),
    checks && (!ctl || ctl.operator_runs) ? get('../checks/control.jsonl') : { text: '' }]);  // operator runs started from the full viewer's Control page (checks/op-*/)
  const mine = lines(own.text).filter(r => r.id && r.metrics);
  const index = [...lines(idx.text), ...mine.map(r => ({ id: r.id, params: r.params, metrics: r.metrics }))];
  // the operator's line of each run: a session's lines carry its id, the build checks carry none
  const oper = [...lines(op.text).filter(r => (checks ? !r.session : r.session === run)), ...mine.map(r => ({ id: r.id, policy: r.policy || r.mode, seconds: r.seconds, control: true }))];
  const dir = id => (mine.some(r => r.id === id) ? '../checks/' : base), key = id => run + '/' + id;  // run ids repeat across sessions
  await Promise.all(index.filter(r => !(key(r.id) in series)).map(async r => { series[key(r.id)] = TH_DATA.csv((await get(`${dir(r.id)}${r.id}/series.csv`)).text); }));
  if (shown !== run) return;  // another session was chosen while these files were loading
  const man = await given(json(meta.text));
  if (!man) { $('note').textContent = 'Cannot read the brief (briefs/two-hosts-open.json or harness/manifest.json is missing).'; return; }
  const raw = { ledger: lines(led.text), index, oper, manifest: man, series: Object.fromEntries(index.map(r => [r.id, series[key(r.id)]])),
                running: ses.some(s => s.id === run && s.running) };
  $('note').innerHTML = `Read from the harness's files at ${new Date().toLocaleTimeString()} · refreshed every 5 s · this page writes nothing · <a href="index_full.html${checks ? '' : '?session=' + run}">the earlier six-page viewer</a> (system objects, packet events, run control)`;
  if (!checks && !raw.ledger.length) { $('page').innerHTML = `<div class="empty">Session ${run} has no record yet. This page fills in as the loop writes its ledger.</div>`; return; }
  TASK_VIEW.page($('page'), { raw, run });  // it redraws only when something changed, so reading, hovering and open sections are not disturbed
}

const s = document.createElement('script');  // the shared content + layout code, never from the browser's cache
s.src = 'adrs_view.js?t=' + Date.now();
s.onload = () => { load(); setInterval(load, 5000); };
s.onerror = () => { $('page').innerHTML = '<div class="empty">Cannot load adrs_view.js.</div>'; };
document.head.appendChild(s);
</script>
</body></html>
