<!-- The evidence view (~/EVIDENCE_VIEW.md, with stage 6 of ~/RESTRUCTURE_PLAN.md): for one session, what was done step by
     step, who did each step, why the model said it took it, and what the simulations showed. Served by harness/control.py.
     evidence_data.js reads a session's files (never its drafts); evidence.js decides the view from the address, loads,
     handles clicks, the replay and the review marks; evidence_marks.js the drawn marks used all over the page; evidence_home.js is Home (no session selected); evidence_run.js the New session
     panel and the banner of a running session; evidence_oprun.js the operator's own simulation and sweep; evidence_page.js a session's page (header strip, overview, the work, how to read); evidence_system.js the system (the two computers with their ns-3 objects, from objects.json, and a card for each object); evidence_glance.js what the session is made of
     (a column per turn, a row per kind of item, one mark per item); evidence_high.js
     the highlights; evidence_best.js the best-so-far chart; evidence_knob.js the simulations of each turn along one knob, and the target measure where one knob alone differs; evidence_tree.js the tree; evidence_top.js the drawings of
     "how to read" (structure map, turn loop, legend);
     evidence_views.js View 1 (session flow) and View 2 (hypothesis map); evidence_flow.js View 3 (one test) and
     the chart; evidence_cards.js the trail, the work-log card, the brief; evidence_test.js a test and a hypothesis;
     evidence_panels.js the experiment panel and a simulation's result panel; evidence_more.js the sections below (brief,
     summary, hypotheses, tests grouped under their experiments, final report) and the evidence sheet; evidence_operator.js the Operator tab; evidence_compare.js and evidence_parallel.js the Compare tab;
     evidence_review.js the review queue and the sign-off; evidence_verdicts.js the table of verdicts against checks and the checks in order; evidence_margin.js the margin of each check; evidence_share.js the links, the export and printing. The page writes nothing
     except the reviewer's ticks and notes, through POST /api/review. The earlier pages: index_runs.html (runs compared,
     any setting against any measure), index_full.html (system objects, packet events, run control and the brief editor). -->
