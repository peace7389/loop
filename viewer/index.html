<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Two hosts, one link</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- The harness's own viewer: a static page. It reads ../ledger.jsonl, ../runs/index.json, ../runs/operator.jsonl,
     ../harness/manifest.json, ../runs/<id>/series.csv and ../checks/control.jsonl every 5 s and writes nothing.
     Content and layout live in adrs_view.js (TH_DATA builds the content, TASK_VIEW.page draws it); the same file
     draws this task inside the ADRS main viewer. One page: every run, then the chosen run (why it was made, its
     numbers over time, what it showed). The charts are Chart.js, loaded from the CDN by adrs_view.js.
     The earlier six-page viewer (system objects, packet events, run control) is kept as index_full.html with
     adrs_view_full.js; the first page as index_old.html. -->
<style>
.viz-root {
  color-scheme: light;
  --surface-0: #f4f4f2; --surface-1: #fcfcfb; --border: #dddcd6;
  --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #7a7974;
  --grid: #e6e5e0; --series-1: #2a78d6; --series-2: #eb6834; --critical: #d03b3b; --good: #0ca30c;
}
@media (prefers-color-scheme: dark) {
  .viz-root {
    color-scheme: dark;
    --surface-0: #121211; --surface-1: #1a1a19; --border: #383835;
    --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
    --grid: #2b2b29; --series-1: #3987e5; --series-2: #d95926; --critical: #d03b3b; --good: #0ca30c;
  }
}
* { box-sizing: border-box; }
body { margin: 0; }
.viz-root { background: var(--surface-0); color: var(--text-primary); min-height: 100vh;
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 20px 24px 40px; }
.bar { max-width: 1280px; margin: 0 auto 14px; display: flex; gap: 10px 18px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--text-secondary); }
.bar .lbl { font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.seg button { font: inherit; font-size: 13.5px; padding: 5px 14px; border: 0; background: var(--surface-1); color: var(--text-secondary); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--border); }
.seg button.on { background: var(--text-primary); color: var(--surface-1); font-weight: 600; }
.bar .end { margin-left: auto; } .bar a { color: var(--text-secondary); }
.empty { max-width: 1280px; margin: 40px auto; color: var(--text-secondary); font-size: 15px; }
</style></head><body>
<div class="viz-root">
  <div class="bar">
    <span class="lbl">Showing</span>
    <span class="seg" id="runs"></span>
    <span class="end" id="note"></span>
  </div>
  <div id="page"><div class="empty">Loading the harness's files…</div></div>
</div>
<script>
const $ = id => document.getElementById(id);
const css = n => getComputedStyle(document.querySelector('.viz-root')).getPropertyValue(n).trim();  // used by adrs_view.js
const RUNS = [['loop', 'The AI session'], ['operator_checks', 'Operator checks (no AI)']];
let run = new URLSearchParams(location.search).get('run') || 'loop', series = {};

async function get(url) {  // text of a file next to the harness, or null; also how long ago it was last written
  try {
    const r = await fetch(url + '?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return { text: null, age: null };
    const d = Date.parse(r.headers.get('Date') || ''), m = Date.parse(r.headers.get('Last-Modified') || '');
    return { text: await r.text(), age: isFinite(d) && isFinite(m) ? (d - m) / 1000 : null };
  } catch (e) { return { text: null, age: null }; }
}
const lines = t => (t || '').split('\n').filter(Boolean).map(l => { try { return JSON.parse(l); } catch (e) { return null; } }).filter(Boolean);

async function load() {
  // control.py (when it serves this page) knows whether a loop is running; the page only reads that
  const st = await get('../api/status'), ctl = (() => { try { const j = JSON.parse(st.text); return j && j.control ? j : null; } catch (e) { return null; } })();
  const [led, idx, op, man, own] = await Promise.all([get('../ledger.jsonl'), get('../runs/index.json'), get('../runs/operator.jsonl'), get('../harness/manifest.json'),
    ctl && !ctl.operator_runs ? { text: '' } : get('../checks/control.jsonl')]);  // not asked for while control.py says there is none yet
  const mine = lines(own.text).filter(r => r.id && r.metrics);  // operator runs started from the run-control page of the full viewer (checks/op-*/): shown with the operator checks, never part of the AI session
  if (man.text == null) { $('note').textContent = 'Cannot read the harness files (is the file server running in ~/project?)'; return; }
  const raw = { ledger: lines(led.text), index: [...lines(idx.text), ...mine.map(r => ({ id: r.id, params: r.params, metrics: r.metrics }))],
                oper: [...lines(op.text), ...mine.map(r => ({ id: r.id, mode: r.mode, seconds: r.seconds, control: true }))],
                manifest: JSON.parse(man.text), series,
                // without control.py: the loop writes the ledger every turn, quiet for 3 minutes = not running
                running: ctl ? !!((ctl.session && ctl.session.running) || ctl.other_loop) : led.age != null && led.age < 180 };
  const dir = id => (mine.some(r => r.id === id) ? '../checks/' : '../runs/');
  await Promise.all(raw.index.filter(r => !(r.id in series)).map(async r => { series[r.id] = TH_DATA.csv((await get(`${dir(r.id)}${r.id}/series.csv`)).text); }));
  const have = { loop: raw.ledger.length > 0, operator_checks: raw.index.some(r => !raw.ledger.some(e => e.type === 'evidence' && (e.body || {}).run_id === r.id)) };
  if (!have[run]) run = have.loop ? 'loop' : 'operator_checks';
  $('runs').innerHTML = RUNS.filter(([k]) => have[k]).map(([k, t]) => `<button data-run="${k}" class="${k === run ? 'on' : ''}">${t}</button>`).join('');
  $('runs').querySelectorAll('button').forEach(b => b.onclick = () => { run = b.dataset.run; history.replaceState(null, '', '?run=' + run); load(); });
  $('note').innerHTML = `Read from the harness's files at ${new Date().toLocaleTimeString()} · refreshed every 5 s · this page writes nothing · <a href="index_full.html">the earlier six-page viewer</a> (system objects, packet events, run control)`;
  if (!have.loop && !have.operator_checks) { $('page').innerHTML = '<div class="empty">No ledger and no runs yet. Start the loop (harness/loop.py) and this page fills in.</div>'; return; }
  TASK_VIEW.page($('page'), { raw, run });  // it redraws only when something changed, so reading, hovering and open sections are not disturbed
}

const s = document.createElement('script');  // the shared content + layout code, never from the browser's cache
s.src = 'adrs_view.js?t=' + Date.now();
s.onload = () => { load(); setInterval(load, 5000); };
s.onerror = () => { $('page').innerHTML = '<div class="empty">Cannot load adrs_view.js.</div>'; };
document.head.appendChild(s);
</script>
</body></html>
